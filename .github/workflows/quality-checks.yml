name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        # The repository currently has no committed package lockfile.
        run: pnpm install --no-frozen-lockfile
      - name: Run unit tests
        run: pnpm test
      - name: Lint checkout changes
        # The existing repository-wide lint baseline has thousands of unrelated formatting errors.
        # Keep this change's lint gate focused on the new checkout utility and tests.
        run: "pnpm exec eslint src/lib/checkout.ts src/lib/checkout.test.ts --rule 'prettier/prettier: off'"
      - name: Build production bundle
        run: pnpm build
